<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador — Compuerta NOT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --mascara: #0E3B2E;
    --serigrafia: #F2EFE6;
    --cobre: #C17A3D;
    --cobre-claro: #E2A870;
    --gris-pista: #8B9A94;
    --linea: rgba(242, 239, 230, 0.16);
    --led-apagado: #2A4A40;
    --led-encendido: #6EE79A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--mascara);
    color: var(--serigrafia);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .etiqueta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--cobre-claro);
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 6px;
  }

  h2 {
    margin: 0 0 20px;
    font-size: 1.2rem;
  }

  .circuito {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 20px 0 28px;
    flex-wrap: wrap;
  }

  .valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    width: 56px;
    text-align: center;
  }

  #valor-entrada { color: var(--cobre-claro); }
  #valor-salida { color: var(--led-encendido); }

  .boton-toggle {
    background: transparent;
    border: 1px solid var(--cobre);
    color: var(--cobre-claro);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 12px 22px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .boton-toggle:hover {
    background: var(--cobre);
    color: var(--mascara);
  }

  .pie-nota {
    color: var(--gris-pista);
    font-size: 0.82rem;
    margin-top: 4px;
  }

  svg { display: block; }

  .traza {
    stroke: var(--gris-pista);
    stroke-width: 2;
    fill: none;
    transition: stroke 0.2s ease;
  }
  .traza.activa { stroke: var(--led-encendido); }

  .compuerta-cuerpo {
    fill: none;
    stroke: var(--serigrafia);
    stroke-width: 2;
  }

  .bola-negacion {
    fill: var(--mascara);
    stroke: var(--serigrafia);
    stroke-width: 2;
    transition: all 0.2s ease;
  }
  .bola-negacion.activa {
    fill: var(--led-encendido);
    stroke: var(--led-encendido);
  }

  .led {
    transition: fill 0.2s ease, filter 0.2s ease;
  }
</style>
</head>
<body>
  <div class="panel">
    <span class="etiqueta">ELECTRÓNICA DIGITAL 1 · COMPUERTAS LÓGICAS</span>
    <h2>Simulador — Compuerta NOT</h2>

    <div class="circuito">
      <span class="valor" id="valor-entrada">0</span>

      <svg width="180" height="80" viewBox="0 0 180 80">
        <!-- traza de entrada -->
        <line id="traza-in" class="traza" x1="0" y1="40" x2="55" y2="40"/>
        <!-- cuerpo del triángulo NOT -->
        <polygon class="compuerta-cuerpo" points="55,15 55,65 120,40"/>
        <!-- bola de negación -->
        <circle id="bola" class="bola-negacion" cx="128" cy="40" r="8"/>
        <!-- traza de salida -->
        <line id="traza-out" class="traza" x1="136" y1="40" x2="180" y2="40"/>
      </svg>

      <span class="valor" id="valor-salida">1</span>
    </div>

    <button class="boton-toggle" id="btn-toggle" onclick="alternar()">CAMBIAR ENTRADA</button>
    <p class="pie-nota" id="tabla-nota">Salida = NOT(Entrada) — 0 → 1, 1 → 0</p>
  </div>

<script>
  let entrada = 0;

  function actualizar() {
    const salida = entrada === 0 ? 1 : 0;

    document.getElementById('valor-entrada').textContent = entrada;
    document.getElementById('valor-salida').textContent = salida;

    const trazaIn = document.getElementById('traza-in');
    const trazaOut = document.getElementById('traza-out');
    const bola = document.getElementById('bola');

    trazaIn.classList.toggle('activa', entrada === 1);
    trazaOut.classList.toggle('activa', salida === 1);
    bola.classList.toggle('activa', salida === 1);
  }

  function alternar() {
    entrada = entrada === 0 ? 1 : 0;
    actualizar();
  }

  actualizar();
</script>
</body>
</html>
