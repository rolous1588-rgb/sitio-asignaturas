<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Cápsula: electroimán (panel)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="css/cp.css?v=1">
</head>
<body class="tv">
<header id="barra">
  <nav id="etapas"></nav>
  <div id="info">
    <span id="cnx" class="punto"></span>
    <span id="gente">👥 0</span>
    <span id="num"></span>
    <button id="bqr" class="btn sm">QR</button>
    <button id="bmenu" class="btn sm" aria-label="Menú">⋮</button>
    <button id="bfs" class="btn sm" aria-label="Pantalla completa">⛶</button>
  </div>
</header>
<main id="esc">
  <h2 id="tit"></h2>
  <div id="cont"></div>
</main>
<footer id="pie">
  <button id="prev" class="nav" aria-label="Anterior">◀</button>
  <div id="ctrl"></div>
  <button id="next" class="nav" aria-label="Siguiente">▶</button>
</footer>

<div id="qr-ov" class="capa" hidden>
  <div class="caja">
    <p class="grande">Escanea para participar</p>
    <div class="qr"></div>
    <p class="url"></p>
    <p class="lbl">Toca para cerrar</p>
  </div>
</div>
<div id="menu" class="capa" hidden>
  <div class="caja menu">
    <p class="grande">Ir a una pantalla</p>
    <div class="lista"></div>
    <div class="row"><button class="btn" id="mnuevo">Empezar de nuevo</button><button class="btn pri" id="mcerrar">Cerrar</button></div>
  </div>
</div>
<div id="girar"><p class="ic">⟳</p><p>Gira el celular: la clase se proyecta en horizontal.</p><button class="btn">Ver así igual</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="../base/config.js?v=me2"></script>
<script src="js/cp-canal.js?v=1"></script>
<script src="js/em-capsula.js?v=1"></script>
<script src="js/cp-panel.js?v=1"></script>
</body>
</html>
